// Standalone build for the Umbra Gradle plugin.
//
//   gradle -p plugins/umbra-gradle-plugin clean jar
//
// The plugin only compiles against the Gradle API and the JDK (no external
// dependencies), so this build works fully offline. The jar is copied to
// plugins/dist/ by ./build-plugins.ps1 (or by the distJar task).
plugins {
    id 'java-gradle-plugin'
    // Gives users a local-install helper: `gradle publishToMavenLocal`
    // publishes io.umbra:umbra-gradle-plugin:3.0.0 (and the plugin marker)
    // to ~/.m2 so `plugins { id 'io.umbra' version '3.0.0' }` resolves via
    // mavenLocal() without any external repository.
    id 'maven-publish'
}

group = 'io.umbra'
version = '3.0.0'

java {
    sourceCompatibility = JavaVersion.VERSION_1_8
    targetCompatibility = JavaVersion.VERSION_1_8
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    if (JavaVersion.current().isJava9Compatible()) {
        // Enforce Java 8 class files even when Gradle runs on a newer JDK.
        options.release.set(8)
    }
}

gradlePlugin {
    plugins {
        umbra {
            id = 'io.umbra'
            implementationClass = 'io.umbra.gradle.UmbraPlugin'
            displayName = 'Umbra Gradle plugin'
            description = 'Protects the project jar with the Umbra Java obfuscator.'
        }
    }
}

jar {
    archiveBaseName = 'umbra-gradle-plugin'
    manifest {
        attributes(
                'Implementation-Title': 'Umbra Gradle Plugin',
                'Implementation-Version': project.version
        )
    }
}

// Copy the plugin jar to plugins/dist/ (the directory QA and users consume).
tasks.register('distJar', Copy) {
    group = 'build'
    description = 'Copies the plugin jar to plugins/dist.'
    dependsOn tasks.named('jar')
    from tasks.named('jar').flatMap { it.archiveFile }
    into file("${projectDir}/../dist")
}
