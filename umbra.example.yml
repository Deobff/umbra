# Umbra 3.4.1 example configuration
#
#   java -jar dist/umbra.jar -c umbra.example.yml
#
# Every section is optional; the values below are the "maximum protection"
# preset. Paths are resolved relative to the current working directory.

input: "app.jar"
output: "app-obf.jar"
keep:
  - "com.example.Main"
  - "@io.umbra.annotations.Keep"
seed: 23303
preserveTimestamps: true
keepPublicApi: false
softKeepPublicApi: false

renamer:
  enabled: true
  prefix: ""
  repackage: true
  repackagePackage: "*"
  renameClasses: true
  renameMethods: true
  renameFields: true
  mappingFile: "umbra-mapping.txt"
  dictionary: "abcdefghijklmnopqrstuvwxyzABCDEFGHIJKLMNOPQRSTUVWXYZ"
  minimumNameLength: 1

stringEncryption:
  enabled: true
  minLength: 2

integerEncryption:
  enabled: true
  includeLong: true

flowObfuscation:
  enabled: true
  level: "normal"          # light | normal | aggressive
  maxInstructions: 8000
  flattening: true
  flatteningExclude: []

exceptionObfuscation:
  enabled: true

methodVirtualization:
  enabled: true
  maxInstructions: 4000
  maxMethods: 0

antiLlm:
  enabled: true
  decoyMethodsPerClass: 2
  decoyCallSitesPerClass: 2
  wrapperLayers: 1
  maxWrappedMethodsPerClass: 12
  shieldVirtualization: true

debugInfo:
  enabled: true
  removeSourceFile: true
  removeLineNumbers: true
  removeLocalVariables: true
  removeSignatures: true
  removeInnerClasses: false
  removeKotlin: true

memberShuffle:
  enabled: true

junkMembers:
  enabled: true
  methods: 4
  fields: 4

reflection:
  enabled: true
  rewriteClassStrings: true

trim:
  enabled: false

watermark:
  enabled: true
  id: "umbra"

mapping:
  enabled: true
  file: "umbra-mapping.txt"

report:
  enabled: true
  htmlFile: "umbra-report.html"
  jsonFile: "umbra-report.json"

protection:
  antiDebug: true

# Advanced options shared by the newer protection modules.
# See docs/OPTIONS.md for the full list and meanings.
options:
  # Archive layout compatibility (Spring Boot fat JAR/WAR, multi-release, JPMS).
  # Class encryption/integrity/native-guard launchers auto-skip on nested
  # layouts with a warning; keep them for flat JARs.
  layout.enabled: "true"
  layout.springBoot: "true"
  layout.war: "true"
  layout.multiRelease: "preserve"     # preserve | flatten
  layout.moduleInfo: "auto"           # auto | keep | drop

  string.strength: "3"
  string.engine: "auto"               # auto | xor | rc4 | chacha20 | aes-ctr | speck
  string.engineOrder: "chacha20,aes-ctr,rc4,speck"
  string.algorithm: "chacha20"
  string.perClassKey: "true"
  string.split: "true"
  string.cache: "true"
  string.stackTraceHide: "true"
  string.wipe: "true"
  string.encryptAll: "false"

  typeConfusion.enabled: "true"
  typeConfusion.level: "1"            # 1 = call ABI, 2 = + private static fields
  typeConfusion.maxPerMethod: "24"

  reflectionGate.enabled: "false"     # opt-in: changes reflection semantics
  reflectionGate.action: "deny"       # deny | mask

  flow.aggressive: "true"
  flow.transpose: "true"
  flow.bogusRanges: "true"
  # One-time program state: the entry carrier of every protected method advances
  # on each call, so two identical calls do not take the same guard path.
  otp.enabled: "false"                # on by default for balanced/maximum/aggressive

  mba.enabled: "true"
  mba.depth: "2"
  mba.ints: "true"
  mba.maxPerMethod: "400"

  vm2.enabled: "true"
  vm2.encryptPayload: "true"
  vm2.opcodeMap: "true"
  vm2.fusion: "true"                  # superinstruction fusion
  vm2.trys: "true"
  vm2.nested: "true"
  vm2.maxInstructions: "4000"

  native.enabled: "false"
  native.compiler: ""
  native.maxInstructions: "800"
  native.maxMethodsPerClass: "0"
  native.keepDll: "false"
  native.atomic: "true"
  native.antiDump: "true"
  native.antiBackfill: "true"

  classEncryption.enabled: "true"
  classEncryption.algorithm: "chacha20"
  classEncryption.integrity: "true"
  classEncryption.antiDump: "true"

  integrity.enabled: "true"
  integrity.level: "2"
  integrity.antiDump: "true"

  antiDebug.level: "2"
  antiDebug.thread: "true"
  antiDebug.jvmti: "true"
  antiDebug.attach: "true"

  # Minecraft mod containers: auto-detected from fabric.mod.json,
  # META-INF/mods.toml, META-INF/neoforge.mods.toml, mcmod.info, mixin configs
  # and access wideners. Adaptation keeps entry/@Mod/Mixin/target classes and
  # turns off class encryption, native code, resources and VM by default.
  minecraft.enabled: "true"
  minecraft.forceVmp: "false"
  minecraft.allowConflicts: "false"

  # Original exclusive body engine (see docs/NOCTURNE.md). When enabled the
  # engine disables flow/flattening/exception/MBA/VM/native/reference/anti-LLM.
  nocturne.enabled: "false"
  nocturne.variants: "3"
  nocturne.maxInstructions: "4000"

  # Metadata hardening and native anti-Frida/anti-debug guard
  decompilerNoise.enabled: "true"
  decompilerNoise.level: "1"
  antiDebug.nativeGuard: "true"
  antiDebug.frida: "true"
  antiDebug.nativeHash: "true"
  antiDebug.watchdogMs: "4000"
  antiDebug.action: "throw"

  # Encrypt non-class resources inside the encrypted archive
  classEncryption.resources: "true"
  classEncryption.resourceIntegrity: "true"
  classEncryption.manifestMinimal: "true"

  # VM2 coverage
  vm2.indy: "true"
  vm2.constructors: "false"
  # ---------------------------------------------------------------------------
  # 移植层（4.0）：把 aidsfuscator / the reference implementation / the reference implementation 的独门技法搬进管线。
  # 全部默认关闭；打开后产物会明显变大、变慢，先用 --verify 在小样本上验证。
  # 逐条判定与源码出处见 docs/port/SPEC-*.md，选项细节见 docs/OPTIONS.md。
  # ---------------------------------------------------------------------------

  # 每个类一个盐字段 + 每方法一个自抵消盐局部量 + 严格盐派发器（the reference implementation）。
  salt.enabled: "false"
  salt.class: "true"
  salt.method: "true"
  salt.methodParams: "false"          # 给 private 方法追加 int 参数（跨类闭包安全判定）
  salt.dispatcher: "true"
  salt.unifyAccess: "true"

  # 每类独立的多态字符串解密器（the reference implementation Poly1/Poly2；order 69，先于经典引擎 70）。
  polyStrings.enabled: "false"
  polyStrings.ratio: "100"
  polyStrings.masks: "0"              # 0 = 每类随机 1..4 条掩码
  polyStrings.traceKey: "true"        # 密钥折进调用点栈帧哈希
  polyStrings.loop: "mix"             # for | dowhile | mix
  polyStrings.codec: "mask"           # mask | caesar | iv | pool

  # 整数常量多态掩码链（the reference implementation IntPolymorphStack，接在整数加密每条载荷路径上）。
  integer.masks: "false"
  integer.masks.count: "0"            # >0 才生效
  integer.masks.random: "true"
  integer.masks.noninvertible: "false"

  # 哈希化数字常量（the reference implementation 四种哈希 + VM 求值；order 79）。
  numberHash.enabled: "false"
  numberHash.codec: "mix"             # skid | bitwise | intellij | legacy | vm | mix
  numberHash.rate: "100"

  # 种子链不透明谓词（the reference implementation；order 88）。
  opaque.enabled: "false"
  opaque.renderer: "conditional"      # conditional | switch | exception | unconditional | internal | mix
  opaque.seed: "static"               # static | enhanced | exception | switch | internal
  opaque.rate: "100"

  # 分支形状（取反 / switch 规范化）与去 final（the reference implementation；order 89 / 39）。
  branch.enabled: "false"
  branch.switchMode: "mix"
  definalize.enabled: "false"

  # 流敏感状态整数（the reference implementation flow ints；order 91）。
  flowInts.enabled: "false"
  flowInts.rate: "100"

  # 类初始化顺序分析与强制（the reference implementation；order 41）。
  classInitOrder.enabled: "false"
  classInitOrder.action: "report"     # report | reorderClinit | hoist

  # 死代码 / 整数复用 / 未使用局部量清理（the reference implementation；order 119）。
  bodyOptimize.enabled: "false"
  bodyOptimize.deadCode: "true"
  bodyOptimize.intReuse: "true"
  bodyOptimize.unusedLocals: "true"

  # native 载荷容器与覆盖（the reference implementation 移植）：LZMA2 单流 + layout.txt 区间表、
  # 每个成员去重 id 缓存、字符串常量加密、intrinsic 首批三个、<clinit> 进 native。
  native.payload: "true"              # 压缩载荷容器
  native.clinit: "true"               # <clinit> 也翻译成 native
  native.intrinsics: "true"           # System.arraycopy / String.equals / Integer.valueOf
  native.targets: ""                  # 空 = 取 native.target+native.arch；可写 "X86_64_WINDOWS,AARCH64_MACOS"
