name: release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Release version without the leading v (for example 3.2.2)"
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 8
        uses: actions/setup-java@v5
        with:
          distribution: zulu
          java-version: "8"

      - name: Resolve version from tag or input
        id: v
        shell: pwsh
        run: |
          if ("${{ github.event_name }}" -eq "workflow_dispatch") {
            $version = "${{ inputs.version }}".Trim().TrimStart("v")
          } else {
            $version = "${{ github.ref_name }}".Trim().TrimStart("v")
          }
          if (-not $version) { throw "could not resolve a release version" }
          Write-Host "release version: $version"
          "version=$version" >> $env:GITHUB_OUTPUT
          "tag=v$version" >> $env:GITHUB_OUTPUT

      - name: Build distribution
        shell: pwsh
        run: .\build.cmd -Task package

      - name: Check packaged artifacts
        shell: pwsh
        run: |
          $version = "${{ steps.v.outputs.version }}"
          $required = @(
            "dist\umbra.jar",
            "dist\umbra-gui-fx.jar",
            "dist\umbra-$version.zip",
            "dist\SHA256SUMS"
          )
          foreach ($file in $required) {
            if (-not (Test-Path $file)) { throw "missing artifact: $file" }
            Write-Host ("{0,-30} {1,10:N0} bytes" -f $file, (Get-Item $file).Length)
          }
          Get-Content "dist\SHA256SUMS" | Write-Host

      - name: Publish release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $version = "${{ steps.v.outputs.version }}"
          $tag = "${{ steps.v.outputs.tag }}"
          $notes = @(
            "Umbra $version - security-hardened Java bytecode protection suite."
            ""
            "Highlights"
            "- JavaFX protection console (umbra-gui-fx.jar): 13 groups / 109 controls, Options / Command / Output views"
            "- One-time program state; --set reaches every typed section"
            "- Hardened VM2 engine, unified Java runtime guard and native guard"
            "- Whole-archive encryption (index v3) with a sample-bound master key and per-entry nonce KDF"
            "- Minecraft mod-container adaptation: Fabric/Quilt, Forge legacy/modern, NeoForge, mixins"
            ""
            "Assets"
            "- umbra.jar - engine only, JDK 8+, no JavaFX required"
            "- umbra-$version.zip - engine + JavaFX console + launchers + example config + docs"
            "- SHA256SUMS - checksums for both user-facing artifacts"
            ""
            "Use the zip if you want the desktop console; the bare jar is enough for CLI, YAML and build-plugin use."
            "Archives protected by an earlier 3.x line must be rebuilt with $version."
          )
          $notes | Set-Content -Path release-notes.md -Encoding UTF8

          $ghArgs = @(
            $tag,
            "--title", "Umbra $version",
            "--notes-file", "release-notes.md",
            "dist\umbra.jar",
            "dist\umbra-$version.zip",
            "dist\SHA256SUMS"
          )
          if ("${{ github.event_name }}" -eq "workflow_dispatch") {
            $ghArgs += @("--target", $env:GITHUB_SHA)
          }
          gh release create @ghArgs
          gh release view $tag --json url,tagName,name,assets | Write-Host
