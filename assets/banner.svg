<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="500" viewBox="0 0 1600 500" role="img" aria-labelledby="title desc">
  <title id="title">Umbra — Java bytecode protection suite</title>
  <desc id="desc">Dark banner: the Umbra wordmark and tagline on the left, and on the right a seven-ring mark whose rings stand for the seven protection layers, closing on a solid umbra core.</desc>

  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0.9" y2="1">
      <stop offset="0" stop-color="#080b12"/>
      <stop offset="0.52" stop-color="#0a0f17"/>
      <stop offset="1" stop-color="#04060a"/>
    </linearGradient>
    <radialGradient id="glowL" cx="0.08" cy="0.02" r="0.85">
      <stop offset="0" stop-color="#2563eb" stop-opacity="0.26"/>
      <stop offset="0.5" stop-color="#2563eb" stop-opacity="0.05"/>
      <stop offset="1" stop-color="#2563eb" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowR" cx="0.78" cy="0.5" r="0.34">
      <stop offset="0" stop-color="#3b82f6" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#3b82f6" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="core" cx="0.38" cy="0.3" r="0.8">
      <stop offset="0" stop-color="#0e1a2c"/>
      <stop offset="0.7" stop-color="#070c15"/>
      <stop offset="1" stop-color="#020407"/>
    </radialGradient>
    <linearGradient id="arc" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#a8e0ff"/>
      <stop offset="0.4" stop-color="#3b82f6"/>
      <stop offset="1" stop-color="#4f46e5" stop-opacity="0.08"/>
    </linearGradient>
    <linearGradient id="rim" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#9cd4ff" stop-opacity="0.85"/>
      <stop offset="1" stop-color="#3b82f6" stop-opacity="0.05"/>
    </linearGradient>
    <linearGradient id="rule" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#3b82f6"/>
      <stop offset="1" stop-color="#3b82f6" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="fadeGrad" x1="1" y1="0" x2="0.1" y2="1">
      <stop offset="0.1" stop-color="#ffffff" stop-opacity="1"/>
      <stop offset="0.55" stop-color="#ffffff" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0.12"/>
    </linearGradient>
    <mask id="ringFade" maskUnits="userSpaceOnUse" x="0" y="0" width="1600" height="500">
      <rect width="1600" height="500" fill="url(#fadeGrad)"/>
    </mask>
    <pattern id="grid" width="52" height="52" patternUnits="userSpaceOnUse">
      <path d="M52 0H0V52" fill="none" stroke="#8ea4c4" stroke-opacity="0.045" stroke-width="1"/>
    </pattern>
    <radialGradient id="vign" cx="0.5" cy="0.5" r="0.72">
      <stop offset="0.45" stop-color="#000000" stop-opacity="0"/>
      <stop offset="1" stop-color="#000000" stop-opacity="0.5"/>
    </radialGradient>
  </defs>

  <rect width="1600" height="500" fill="url(#bg)"/>
  <rect width="1600" height="500" fill="url(#grid)"/>
  <rect width="1600" height="500" fill="url(#glowL)"/>
  <rect width="1600" height="500" fill="url(#glowR)"/>
  <rect width="1600" height="500" fill="url(#vign)"/>

  <!-- seven layers: seven concentric rings dissolving into the lower left, closing on a solid umbra core -->
  <g mask="url(#ringFade)">
    <g transform="translate(1248 250)">
      <circle r="196" fill="none" stroke="#3b82f6" stroke-opacity="0.05" stroke-width="12"/>
      <circle r="196" fill="none" stroke="#3b82f6" stroke-opacity="0.32" stroke-width="1"/>
      <circle r="168" fill="none" stroke="#3b82f6" stroke-opacity="0.27" stroke-width="1"/>
      <circle r="140" fill="none" stroke="#3b82f6" stroke-opacity="0.23" stroke-width="1"/>
      <circle r="112" fill="none" stroke="#3b82f6" stroke-opacity="0.19" stroke-width="1"/>
      <circle r="84" fill="none" stroke="#3b82f6" stroke-opacity="0.16" stroke-width="1"/>
      <circle r="56" fill="none" stroke="#3b82f6" stroke-opacity="0.13" stroke-width="1"/>
      <circle r="28" fill="none" stroke="#3b82f6" stroke-opacity="0.10" stroke-width="1"/>

      <circle r="196" fill="none" stroke="url(#arc)" stroke-width="2.2"
              stroke-dasharray="300 940" stroke-linecap="round" transform="rotate(-150)"/>
      <circle cx="-169.7" cy="-98" r="3" fill="#dcf1ff" opacity="0.92"/>
    </g>
  </g>

  <g transform="translate(1248 250)">
    <circle r="28" fill="url(#core)"/>
    <circle r="28" fill="none" stroke="url(#rim)" stroke-width="1.4"
            stroke-dasharray="46 130" stroke-linecap="round" transform="rotate(-140)"/>
  </g>

  <g font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif">
    <text x="112" y="174" font-size="15" font-weight="600" fill="#6f9bff" letter-spacing="4.6">JAVA BYTECODE PROTECTION SUITE</text>

    <text x="110" y="306" font-size="136" font-weight="600" fill="#f3f7fd" letter-spacing="-4.8">Umbra</text>

    <rect x="112" y="334" width="188" height="2.5" rx="1.25" fill="url(#rule)"/>

    <text x="112" y="386" font-size="29" fill="#cfdbec">Java bytecode protection, without compromise.</text>

    <text x="112" y="422" font-size="16.5" fill="#7d8da6" letter-spacing="0.3">Renaming · Encryption · Control flow · VM2 · Native guards · Anti-debug · Verification</text>

    <rect x="112" y="450" width="876" height="1" fill="#17212f"/>

    <g font-size="14.5" fill="#6b7c95" letter-spacing="1.1">
      <text x="112" y="484">JDK 8+</text>
      <text x="220" y="484">ASM 9.11</text>
      <text x="340" y="484">GUI · CLI · YAML</text>
      <text x="520" y="484">Spring Boot · WAR · JPMS</text>
      <text x="774" y="484">Minecraft mods</text>
    </g>
  </g>
</svg>
