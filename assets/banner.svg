<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="360" viewBox="0 0 1280 360" role="img" aria-labelledby="title desc">
  <title id="title">Umbra — Java bytecode protection suite</title>
  <desc id="desc">Umbra wordmark with tagline and capability chips on a dark gradient banner.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#070b14"/>
      <stop offset="0.55" stop-color="#0d1526"/>
      <stop offset="1" stop-color="#050810"/>
    </linearGradient>
    <radialGradient id="glowA" cx="0.18" cy="0.1" r="0.75">
      <stop offset="0" stop-color="#3b82f6" stop-opacity="0.30"/>
      <stop offset="1" stop-color="#3b82f6" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowB" cx="0.92" cy="0.95" r="0.7">
      <stop offset="0" stop-color="#8b5cf6" stop-opacity="0.24"/>
      <stop offset="1" stop-color="#8b5cf6" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#60a5fa"/>
      <stop offset="1" stop-color="#a78bfa"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#94a3b8" stroke-opacity="0.06" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="1280" height="360" fill="url(#bg)"/>
  <rect width="1280" height="360" fill="url(#grid)"/>
  <rect width="1280" height="360" fill="url(#glowA)"/>
  <rect width="1280" height="360" fill="url(#glowB)"/>
  <circle cx="1178" cy="54" r="1.6" fill="#93c5fd" opacity="0.75"/>
  <circle cx="1216" cy="88" r="1.2" fill="#a78bfa" opacity="0.65"/>
  <circle cx="1090" cy="120" r="1" fill="#e2e8f0" opacity="0.45"/>

  <g transform="translate(78 94)">
    <text x="0" y="0" font-family="Georgia, 'Times New Roman', serif" font-size="86" font-weight="700" fill="#f8fafc" letter-spacing="-2">Umbra</text>
    <text x="302" y="-14" font-family="'Segoe UI', Arial, sans-serif" font-size="15" font-weight="600" fill="#93c5fd" letter-spacing="3">3.2.1</text>
    <rect x="0" y="30" width="150" height="3" rx="1.5" fill="url(#accent)"/>
    <text x="0" y="82" font-family="'Segoe UI', Arial, sans-serif" font-size="24" fill="#cbd5e1">Java bytecode protection, without compromise.</text>
    <text x="0" y="119" font-family="'Segoe UI', Arial, sans-serif" font-size="16" fill="#7f8ea3">Layout-aware · Multi-engine encryption · VM2 · Native guards · Anti-debug · GUI + CLI</text>
  </g>

  <g font-family="'Segoe UI', Arial, sans-serif" font-size="14" fill="#dbeafe">
    <g transform="translate(80 276)">
      <rect width="132" height="32" rx="16" fill="#0f1b2d" stroke="#1e3a5f"/>
      <text x="16" y="21">JDK 8+</text>
    </g>
    <g transform="translate(224 276)">
      <rect width="162" height="32" rx="16" fill="#0f1b2d" stroke="#1e3a5f"/>
      <text x="16" y="21">Spring Boot / WAR</text>
    </g>
    <g transform="translate(398 276)">
      <rect width="150" height="32" rx="16" fill="#0f1b2d" stroke="#1e3a5f"/>
      <text x="16" y="21">VM2 + Native</text>
    </g>
    <g transform="translate(560 276)">
      <rect width="156" height="32" rx="16" fill="#0f1b2d" stroke="#1e3a5f"/>
      <text x="16" y="21">GUI / CLI / YAML</text>
    </g>
    <g transform="translate(728 276)">
      <rect width="142" height="32" rx="16" fill="#0f1b2d" stroke="#1e3a5f"/>
      <text x="16" y="21">Minecraft</text>
    </g>
  </g>

  <g transform="translate(1010 258)">
    <path d="M0 0 L56 0 L56 56 L0 56 Z" fill="none" stroke="#334155" stroke-width="1"/>
    <path d="M8 28 L28 12 L48 28 L48 44 L8 44 Z" fill="#111c30" stroke="#60a5fa" stroke-width="1.2"/>
    <path d="M20 44 L20 32 L28 24 L36 32 L36 44" fill="none" stroke="#a78bfa" stroke-width="1.2"/>
  </g>
</svg>
